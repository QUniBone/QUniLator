# Boot 2.11BSD on qbone to the single-user shell and prove it answers.
#
# The script applies the 211bsd configuration and restarts the machine
# itself, once the console is connected and the matching anchor is set:
#
#   node dist/src/cli.js run scripts/qbone-211bsd-singleuser.yaml
#
# The boot block's ": " prompt takes the kernel path typed one echo-confirmed
# character at a time — the exact line ("ra(0,0,0)unix") that arrives as
# "r,)x" when sent as a burst.
console: auto
host: qbone
title: 2.11BSD boot to single user
timeout: 60s
machine:
  config: 211bsd
  start: restart
deviations:
  - event: halt
    fail: the CPU halted during the boot
steps:
  - name: boot-rom
    expect: /Boot from ra\(0,0,0\)/
    timeout: 90s
  - name: boot-block
    expect: ": "
    send: ra(0,0,0)unix
  - name: kernel
    expect: /2\.11 BSD UNIX/
  - name: single-user
    expect: "erase, kill ^U, intr ^C"
    timeout: 120s
  - name: shell
    expect: "# "
    send: echo qcon test ok
  - name: proof
    expect: /\nqcon test ok/
  - expect: "# "
    done: true
