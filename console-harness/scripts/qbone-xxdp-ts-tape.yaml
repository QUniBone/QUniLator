# Any TS11/TSV05 XXDP tape against the emulated TSV05 on qbone, whose Q-bus
# M7196 carries the Extended Features the TS tapes past CVTSD ask for. The
# tape and the test selection are variables, so one script surveys the family:
#
#   node dist/src/cli.js run scripts/qbone-xxdp-ts-tape.yaml \
#       --var TAPE=VTSCD0 --var SEL=/TESTS:1-2:4-8
#
# SEL takes a DRS test selection - ranges and singles joined by colons - or an
# empty string for every test. What the selections leave out: CVTSD 005 and
# CVTSC 003 SUB 002 load test functions into the controller's microcode store
# through write subsystem memory, which the model does not carry. A DVC FTL
# drops the unit and aborts the pass, so one failing test hides every test
# behind it.
#
# The error match carries the test and subtest, so the livelock guard reads a
# new error as progress and stops only on the same one repeating.
console: "0"
host: qbone
title: XXDP ${TAPE} against the emulated TS11
timeout: 60s
machine:
  config: kdj11-a-ts
  start: dc_on
deviations:
  - event: halt
    fail: the CPU halted during the run
steps:
  - name: boot
    expect:
      - match: "ENTER DATE"
        send: ""
      - match: /RESTART ADDR|\n\./
        goto: load
    timeout: 120s
  - name: prompt
    expect: /\n\./
  - name: load
    wait: 2s
    send: R ${TAPE}
  - name: supervisor
    expect: "DR>"
    send: START${SEL}
    timeout: 90s
  - name: change-hw
    expect: /CHANGE HW.*\?/i
    send: Y
  - name: dialog
    expect:
      - match: /UNITS.*\?/i
        send: "1"
        goto: dialog
      - match: /CHANGE SW.*\?/i
        send: "N"
        goto: dialog
      - match: /ZERO LD UNIT|DOIT ANYWAY/i
        send: "N"
        goto: dialog
      - match: /SELECT DRIVE[^?]*\?/i
        send: "0"
        goto: dialog
      - match: /\(L\)\s*\?/
        send: "N"
        goto: dialog
      - match: /\?[\x00-\x20]*$/
        send: ""
        goto: dialog
      - match: /END PASS|\b0 CUMULATIVE ERRORS|EOP\s+\d/i
        done: true
      - match: /(HRD ERR|SFT ERR|DVC FTL|FTL ERR)\s+\d+ ON UNIT \d+ TST \d+ SUB \d+/i
        goto: dialog
    timeout: 900s
