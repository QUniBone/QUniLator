# Boot XXDP on qbone and run the RLV12 controller diagnostic ZRLGE0 through
# the DRS dialog to end of pass.
#
# The script applies the xxdp configuration (rl0 carries the XXDP 2.5 pack)
# and restarts the machine itself, once the console is connected:
#
#   node dist/src/cli.js run scripts/qbone-xxdp-zrlge0.yaml
#
# Dialog prompts are answered by name where the value matters; any other
# prompt takes its default with a bare CR. A named case starts earlier in
# the line than the catch-all, so it always wins where both apply — except
# for a logical "(L)" prompt, which has no default and must be answered.
console: auto
host: qbone
title: XXDP ZRLGE0 on the RLV12
timeout: 60s
machine:
  config: xxdp
  start: restart
deviations:
  - event: halt
    fail: the CPU halted during the run
  - match: /NXT TST MAY ZERO LD UNIT/
    fail: >-
      the next test would zero the pack on the loaded drive — drive 0 carries
      XXDP itself; run the drive tests against drive 1 with a scratch pack
steps:
  - name: boot
    expect:
      - match: "ENTER DATE"
        send: ""
      - match: /RESTART ADDR|\n\./
        goto: load
    timeout: 90s
  - name: prompt
    expect: /\n\./
  - name: load
    wait: 2s
    send: R ZRLGE0
  - name: supervisor
    expect: "DR>"
    send: START
    timeout: 90s
  - name: dialog
    expect:
      - match: /CHANGE HW.*\?/i
        send: Y
        goto: dialog
      - match: /# UNITS.*\?/i
        send: "1"
        goto: dialog
      - match: /RL11=1.*\?/i
        send: "3"
        goto: dialog
      # a logical prompt has no default: a bare CR is re-asked forever
      - match: /CHANGE SW.*\?/i
        send: "N"
        goto: dialog
      - match: /\(L\)\s*\?/
        send: "N"
        goto: dialog
      # any other prompt takes its default; DRSSM ends a prompt with "? ",
      # DRSXM with "? ^D" — both leave the '?' at the end of the window
      - match: /\?[\x00-\x20]*$/
        send: ""
        goto: dialog
      # EOP prints on failing runs too; a pass is the zero error count
      - match: /END PASS|\b0 CUMULATIVE ERRORS/i
        done: true
      - match: /DVC FTL|FTL ERR|FATAL|[1-9]\d* CUMULATIVE ERRORS/i
        fail: the diagnostic reported errors
    timeout: 300s
