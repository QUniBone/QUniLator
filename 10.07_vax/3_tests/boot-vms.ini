; boot-vms.ini: boot VMS on the vendored VAX-11/780 and stop at the login prompt
;
; Driven by boot-vms.sh, which supplies the arguments and judges the run; see
; that script for what the test proves and how to point it at an image.
;
;   %1  system disk image, an MSCP volume attached as RQ0
;   %2  the date and time to answer the startup prompt with
;
; The console log goes to console.log in the working directory, and the script
; reads it. The rules below answer the two prompts a VMS startup asks of the
; console operator and leave the simulator at DCL's Username: prompt.

set cpu 8m
set cpu idle
set rq0 rd54
attach rq0 %1
set console log=console.log

; VMS asks for the date and time because the 780 has no watch chip.
expect "PLEASE ENTER DATE AND TIME" send "%2\r"; go

; LOGINOUT announces the interactive limit once STARTUP has run. A carriage
; return on the console then brings up DCL.
expect "login interactive limit" send after=2000000 "\r"; go

expect "Username:" echo BOOT-TEST-REACHED-LOGIN; exit

boot rq0
