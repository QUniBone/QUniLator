// Keep unattended-upgrades away from the emulator package.
//
// Installing it restarts the service, which stops the emulated machine and
// brings the board back up in its startup configuration. A running Unix or RSX
// has its buffer cache cut. That is worth doing deliberately, with the interface
// saying so and the operator deciding when - and never at three in the morning
// with nobody watching.
//
// The interface's own install passes --allow-change-held-packages, so an
// operator who additionally holds the package by hand is not blocked from a
// deliberate update.
//
// Both brands are named: the file is installed unrebranded into both packages,
// and a board carries one of them.
Unattended-Upgrade::Package-Blacklist {
    "qbone";
    "unibone";
};
