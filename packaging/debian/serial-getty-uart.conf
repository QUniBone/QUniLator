# The login on one of the board's UARTs, at the speed they all run.
#
# The stock unit offers a descending list of speeds for BREAK to step through,
# so a terminal that sends one drops the line to 57600 and the operator reads
# noise; a list of one holds it at 115200.
#
# Which UARTs carry a login is settable from the web interface (System page);
# this drop-in is what any of them runs as once it does.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --noreset --noclear --keep-baud 115200 - $TERM
