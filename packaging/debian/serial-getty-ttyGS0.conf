# The gadget's serial port carries a carrier signal only while a host is
# attached to it. The stock unit has systemd open the port and set it up before
# it execs agetty, and that setup waits on the carrier: with nothing plugged in
# the process parks in the kernel before it ever becomes agetty, where no signal
# reaches it. Systemd then cannot stop the unit, and a stop job that never
# finishes holds up shutdown for good.
#
# So agetty opens the port itself, with --local-line for CLOCAL, which is what
# makes the open proceed with no carrier. It runs as an ordinary process that
# SIGTERM ends, and the login prompt still waits on the port for a host to
# arrive.
[Unit]
# the port exists for as long as the gadget is bound, and no longer
BindsTo=qunilator-usb-gadget.service
After=qunilator-usb-gadget.service

[Service]
Type=simple
ExecStart=
ExecStart=-/sbin/agetty --local-line --noclear --keep-baud 115200 %I vt220
TTYPath=
TTYReset=no
TTYVHangup=no
StandardInput=null
StandardOutput=journal
StandardError=journal
