name: build

# Continuous integration: build the emulator and the qbone package from nothing
# but this repository. The PRU firmware is compiled here too (crossbuild.sh
# fetches the TI code generation tools into a container), so no BeagleBone takes
# part. Releasing is separate: release-deb.yml on a tag, release-image.yml on
# demand.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  config-test:
    # Host test of the web service's configuration model: builds webconfigs.cpp
    # against a synthetic device set and drives the model, no BeagleBone and no
    # cross toolchain. The first automated API test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the configuration-model host test
        run: ./10.05_web/tools/run_config_test.sh

  common-test:
    # The host tests of the shared code in 90_common, today the PDP-11
    # disassembler against its opcode table. Target independent: one run covers
    # both buses, and neither the board nor the cross toolchain takes part.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the 90_common host tests
        run: make -C 90_common/test test

  cpu-test:
    # The emulated CPU cores against the original DEC MAINDEC diagnostics, on a
    # fake bus built from a word array: host compiler, no BeagleBone, no bus
    # hardware. A core defect a tape finds turns this job red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the MAINDEC diagnostics against both CPU cores
        run: make -C 10.06_cputest/2_src -j"$(nproc)" test

  console-harness:
    # The console scripting harness (qcon) against its mock guest: echo
    # pacing, drop recovery, anchoring, deviations, step branching and the
    # asciicast recording — the console faults it exists to survive, staged
    # in memory with no board.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and test the console harness
        run: |
          cd console-harness
          npm ci
          npm test

  appliance-scripts:
    # The appliance's shell tools and units, checked without a board: the
    # updater drives apt and systemd on a live machine, so a syntax error or a
    # malformed unit is found here rather than on the board it would strand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the updater against a fake board
        # The failure paths - a package whose service will not start, a dpkg that
        # dies, a repository that has gone away - are the ones hardest to arrange
        # on hardware and worst to get wrong, so they are exercised here against
        # stubbed apt/dpkg/systemd.
        run: ./packaging/tests/updater-test.sh

      - name: Run the devkit against a fake board
        # The source-tree install: fetching into a /root which is not empty, the
        # bus-specific examples merged into one tree, and a shortcut for each
        # example which resolves - none of which needs a board to check.
        run: ./packaging/tests/devkit-test.sh

      - name: Check the shell tools parse
        run: |
          for s in packaging/version.sh packaging/build-deb.sh \
                   packaging/tests/updater-test.sh \
                   packaging/tests/updater-sandbox.sh \
                   packaging/tests/devkit-test.sh \
                   packaging/debian/qunilator-update \
                   packaging/debian/qunilator-devkit \
                   packaging/debian/qunilator-network \
                   packaging/debian/qunilator-setup \
                   packaging/debian/qunilator-resize \
                   packaging/debian/qunilator-announce \
                   packaging/debian/qunilator-rename; do
            case "$(head -1 "$s")" in
              *bash) bash -n "$s" ;;
              *) sh -n "$s" ;;
            esac
            echo "ok $s"
          done

      - name: Check the units are well formed
        # systemd-analyze verify resolves each unit as systemd would. It warns
        # about the executables it cannot find on a runner, which is not this
        # repository's business, so only the findings about the files count.
        #
        # The units are selected by content, not by name: avahi-qunilator.service
        # is an avahi DNS-SD service file that happens to carry the .service
        # suffix, and systemd rightly refuses it.
        run: |
          units=$(grep -l '^\[Unit\]' packaging/debian/*.service packaging/debian/*.timer)
          echo "checking: $units"
          out=$(systemd-analyze verify $units 2>&1 || true)
          echo "$out"
          # drop the runner's missing-executable noise
          bad=$(printf '%s\n' "$out" | grep -v -e "Command .* is not executable" \
                -e "not found" -e "does not exist" || true)
          [ -z "$bad" ] || { echo "unit problems above" >&2; exit 1; }

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: QBUS
            flag: ''
            suffix: _q
          - platform: UNIBUS
            flag: '-u'
            suffix: _u
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        # build-deb.sh runs natively when dpkg-deb and dtc are present, and
        # cross-compiles qunilator-leds with the armhf gcc; supply all three.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev device-tree-compiler gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Write build.env
        # crossbuild.sh reads the board and its bus from build.env and refuses
        # to build without one. A runner has no board and deploys nothing, so
        # the host here is never contacted; the bus is qbus, which is what an
        # empty matrix flag builds, and -u overrides it for the other leg.
        run: |
          cat > build.env <<'EOF'
          QUNILATOR_HOST=ci@ci
          QUNILATOR_BUS=qbus
          QUNILATOR_DEPLOY_MODE=appliance
          QUNILATOR_REMOTE_DIR=QUniLator
          EOF

      - name: Cross-compile ${{ matrix.platform }}
        # -t leaves the CPU core tests to the cpu-test job above, which runs
        # them on every push and reports as a check of its own. A UNIBUS
        # crossbuild runs them for the benefit of a workstation build, where
        # nothing else would.
        run: ./crossbuild.sh ${{ matrix.flag }} -t

      - name: Check the PRU firmware is reproducible
        # A second build from clean must land on the same instruction words.
        # The bus state machine's timing is what clpru's output decides, so a
        # firmware that varies between builds is not a firmware to ship.
        run: |
          mkdir -p /tmp/fw1
          cp 10.01_base/4_deploy${{ matrix.suffix }}/*_array.c /tmp/fw1/
          ./crossbuild.sh ${{ matrix.flag }} -p -t
          for f in /tmp/fw1/*_array.c; do
            cmp "$f" "10.01_base/4_deploy${{ matrix.suffix }}/$(basename "$f")"
          done
          echo "PRU firmware reproducible"

      - name: Build the package
        run: ./packaging/build-deb.sh ${{ matrix.flag }}

      - name: Check the compiled-in version is the changelog version
        # The package, the binary and the web bundle all derive their version
        # from packaging/debian/changelog through packaging/version.sh. A service
        # that reports a version other than the one the installed package
        # carries cannot verify its own update, so require all three to agree.
        run: |
          ver=$(./packaging/version.sh)
          echo "changelog version: $ver"
          strings -a 10.03_app_demo/4_deploy${{ matrix.suffix }}/qbone-web \
            | grep -qF "$ver, compile " \
            || { echo "the binary does not carry version $ver" >&2; exit 1; }
          grep -qF "$ver" 10.05_web/3_frontend/dist/assets/*.js \
            || { echo "the web bundle does not carry version $ver" >&2; exit 1; }
          ls *_"$ver"_armhf.deb \
            || { echo "no package built for version $ver" >&2; exit 1; }

      - name: Check the package installs cleanly
        run: |
          deb=$(ls *_armhf.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # lintian-style sanity: the maintainer scripts must at least parse
          dpkg-deb --control "$deb" /tmp/ctrl
          for s in postinst prerm postrm; do sh -n "/tmp/ctrl/$s"; done

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: '*_armhf.deb'
