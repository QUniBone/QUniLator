name: release-deb

# Tag-driven package release. Push a v* tag whose version matches the top of
# packaging/debian/changelog; this builds both boards' packages (qbone for QBUS,
# unibone for UNIBUS), attaches them to the tag's GitHub Release, and pushes them
# to the apt repository so `apt install`/`apt upgrade` see them. The apt push
# skips itself when the deploy key/host are not configured, so the GitHub
# Release still happens on a fork. The release-image workflow attaches the two
# appliance images to the same release.
#
# Nothing is published until the UNIBUS package has passed the hardware test
# (hil.yml) on the UniBone: a release that cannot boot VMS there stops here.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release and upload the assets

# The base OS version the images are built on, named in the shared release note.
env:
  BASE_VERSION: 'Debian 13.6, base-v6.12 armhf (2026-07-15)'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev device-tree-compiler gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Write build.env
        # crossbuild.sh reads the board and its bus from build.env and refuses
        # to build without one. A runner has no board and deploys nothing, so
        # the host here is never contacted; the bus is qbus, and -u below
        # builds the other one.
        run: |
          cat > build.env <<'EOF'
          QUNILATOR_HOST=ci@ci
          QUNILATOR_BUS=qbus
          QUNILATOR_DEPLOY_MODE=appliance
          QUNILATOR_REMOTE_DIR=QUniLator
          EOF

      - name: Build both packages
        run: |
          ./crossbuild.sh                 # QBUS binary
          ./packaging/build-deb.sh        # -> qbone_<ver>_armhf.deb
          ./crossbuild.sh -u              # UNIBUS binary
          ./packaging/build-deb.sh -u     # -> unibone_<ver>_armhf.deb

      - name: Check the tag matches the changelog version
        # Both packages take their version from packaging/debian/changelog. A tag
        # that disagrees would ship differently-numbered artifacts than the tag
        # claims, so require the changelog version to be the tag, or the tag with
        # a Debian revision (v1.6.0 -> 1.6.0 or 1.6.0-1).
        run: |
          tag=${GITHUB_REF_NAME#v}
          for deb in *_armhf.deb; do
            debver=$(echo "$deb" | sed -n 's/^[a-z]*_\(.*\)_armhf\.deb$/\1/p')
            echo "$deb: changelog=$debver tag=$tag"
            case "$debver" in
              "$tag"|"$tag"-*) : ;;
              *) echo "tag $GITHUB_REF_NAME does not match $deb ($debver)" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: '*_armhf.deb'

  hil:
    needs: build
    uses: ./.github/workflows/hil.yml
    with:
      package-artifact: release-packages

  publish:
    needs: [build, hil]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: release-packages

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: the top changelog stanza as markdown, plus a summary.
          # docs/release-notes.md is the style that stanza is written in.
          # awk prints the stanza body (past the version header, up to the
          # signature). Its first paragraph is the title line, which names the
          # release; sed turns "  * " bullets into "- " and reindents
          # continuation lines of the rest.
          stanza=$(awk 'NR==1 {next} /^ --/ {exit} {print}' packaging/debian/changelog)
          title=$(printf '%s\n' "$stanza" | awk 'NF {n++} n==1 && NF {t=$0} n==1 && !NF && t {print t; exit} n==2 {exit}' \
                  | sed 's/^ *//')
          if [ -z "$title" ] || [ "${title#\* }" != "$title" ]; then
            echo "the top changelog stanza has no title line (docs/release-notes.md)" >&2
            exit 1
          fi
          body=$(printf '%s\n' "$stanza" | awk 'NF && !t {t=1; next} t' | sed '/./,$!d' \
                 | sed -e 's/^  \* /- /' -e 's/^    /  /')
          # The files table names each board's assets: the release page shows
          # the first ten assets and folds the rest under "Show all".
          debver=$(ls qbone_*_armhf.deb | sed -e 's/^qbone_//' -e 's/_armhf\.deb$//')
          files=$(for b in qbone:QBUS unibone:UNIBUS; do
                    n=${b%%:*}
                    printf '| %s (%s) | `%s-dist.img.xz` | `%s_%s_armhf.deb` | `%s_%s_armhf.update.tar` |\n' \
                      "$n" "${b#*:}" "$n" "$n" "$debver" "$n" "$debver"
                  done)
          notes=$(printf '%s\n\n| Board | Appliance image | Package | Update file |\n|---|---|---|---|\n%s\n\nAll files are under Assets below; "Show all" lists the ones past the first ten. Image base: %s.\n' \
                  "$body" "$files" "$BASE_VERSION")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME — $title" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" *_armhf.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" *_armhf.deb --title "$GITHUB_REF_NAME — $title" \
              --notes "$notes"
          fi

      - name: Publish to the apt repository
        # Push both debs to the host over the forced-command deploy key. The
        # host-side command (roles/apt-repo/apt-receive) drops them into
        # pool/main and rebuilds the signed index. Skips itself when the deploy
        # key/host are not configured, so a fork still gets the GitHub Release.
        env:
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
          APT_DEPLOY_HOST: ${{ vars.APT_DEPLOY_HOST }}
          APT_DEPLOY_PORT: ${{ vars.APT_DEPLOY_PORT }}
        run: |
          if [ -z "$APT_DEPLOY_KEY" ] || [ -z "$APT_DEPLOY_HOST" ]; then
            echo "no apt deploy configured (APT_DEPLOY_KEY secret / APT_DEPLOY_HOST var); skipping"
            exit 0
          fi
          key=$(mktemp); printf '%s\n' "$APT_DEPLOY_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          tar -c *_armhf.deb | ssh -i "$key" -p "${APT_DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$APT_DEPLOY_HOST"

      - name: Attach the update files
        # A board with no way to the repository updates from an update file:
        # the repository's signed index and the package, which the board checks
        # against the keyring it already carries. Built from the index the step
        # above has just rebuilt, so it skips itself with the apt publish.
        env:
          GH_TOKEN: ${{ github.token }}
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
          APT_REPO_URL: ${{ vars.APT_REPO_URL }}
        run: |
          if [ -z "$APT_DEPLOY_KEY" ] || [ -z "$APT_REPO_URL" ]; then
            echo "no apt repository configured (APT_DEPLOY_KEY secret / APT_REPO_URL var); skipping"
            exit 0
          fi
          ./packaging/build-update-bundle.sh "$APT_REPO_URL" *_armhf.deb
          gh release upload "$GITHUB_REF_NAME" *_armhf.update.tar --clobber
